name: Keep Render awake

# Free Render web services spin down after ~15 minutes without inbound traffic.
# This workflow pings the service every 5 minutes so it stays warm and the
# in-process scheduler keeps firing reminders on time.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the service
        run: |
          set -e
          URL="${{ secrets.RENDER_PING_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_PING_URL secret is not set — skipping"
            exit 0
          fi
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$URL/healthz" || true)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then
              echo "service is awake"
              exit 0
            fi
            sleep 5
          done
          echo "service did not respond yet"
          exit 0
